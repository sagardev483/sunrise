<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="f.css">
    <title>Admission Form</title>
  </head>
  <body>
    <div class="form-container">
      <form class="modern-form" action="https://docs.google.com/forms/d/e/1FAIpQLSfdx6kLBS9Y8d1O4Rxu3XP38Ep1uCwvT3PTS25HY6c9Uz9VIA/formResponse" method="POST">
        <h2>Admission Form</h2>
        <p>We'd love to hear from you! Fill out the form below.</p>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="entry.123456789" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="entry.987654321" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="class">Class for Registration</label>
          <input type="text" id="class" name="entry.111111111" placeholder="Enter the class" required>
        </div>

        <div class="form-group">
          <label for="guardians-name">Guardian's Name</label>
          <input type="text" id="guardians-name" name="entry.222222222" placeholder="Enter your Parent's name" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="entry.333333333" rows="5" placeholder="Write your message here" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </body>
</html>
